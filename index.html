<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Architect | Engenharia de Prompts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="header">
            <h1>Prompt Architect</h1>
            <p>Descreva o que você precisa. Nossa infraestrutura constrói o prompt perfeito.</p>
        </header>

        <div class="workspace">
            <!-- Painel de Entrada -->
            <div class="input-section">
                <label for="context-input">Contexto e Objetivo</label>
                <textarea id="context-input"
                    placeholder="Ex: Preciso de um post para LinkedIn sobre a importância da liderança humanizada, com tom inspirador e focando em startups de tecnologia. Quero o resultado em tópicos."></textarea>
                <button id="generate-btn">Estruturar Prompt</button>
            </div>

            <!-- Painel de Saída -->
            <div class="output-section">
                <div class="output-header">
                    <label>Prompt Otimizado</label>
                    <button id="copy-btn" class="secondary-btn">Copiar Área de Transferência</button>
                </div>
                <div id="prompt-output" class="output-box">O prompt estruturado e otimizado aparecerá aqui.</div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
